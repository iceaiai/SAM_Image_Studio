name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphinx:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: sam-image-studio-docs
          path: docs/_build/html/
          if-no-files-found: error
      - name: Check out the static Pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-publish
      - name: Update the static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rsync -a --delete --exclude=.git --exclude=CNAME --exclude=.doctrees --exclude=.buildinfo docs/_build/html/ .pages-publish/
          touch .pages-publish/.nojekyll
          git -C .pages-publish config user.name 'github-actions[bot]'
          git -C .pages-publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .pages-publish add --all
          if ! git -C .pages-publish diff --cached --quiet; then
            git -C .pages-publish commit -m "Publish Sphinx website from ${GITHUB_SHA}"
            git -C .pages-publish push origin HEAD:gh-pages
          fi
      - name: Request a GitHub Pages build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
